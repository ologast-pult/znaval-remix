<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>ZNAVAL - People Decide</title>
    <script src="https://www.google.com/recaptcha/api.js?render=6LcH6xMtAAAAABD8J8v3JBCiSnIwSQ3A5D0I-XYq"></script>
    <script>
      function onClick(e) {
        e.preventDefault();
        if (window.grecaptcha) {
          const recaptchaInstance = window.grecaptcha.enterprise || window.grecaptcha;
          recaptchaInstance.ready(async () => {
            const token = await recaptchaInstance.execute('6LcH6xMtAAAAABD8J8v3JBCiSnIwSQ3A5D0I-XYq', {action: 'LOGIN'});
            // Здесь можно добавить логику отправки токена на сервер
            console.log('reCAPTCHA token:', token);
          });
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
